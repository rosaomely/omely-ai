<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omely AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
            width: 100vw;
        }

        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid #2d2e30;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
            flex: 1;
        }

        .new-chat-btn {
            background-color: #2b2c2f;
            color: #e3e3e3;
            border: none;
            padding: 10px 16px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #333538;
        }

        .model-selector-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .model-label {
            font-size: 0.75rem;
            color: #8e918f;
        }

        .model-select {
            background-color: #2b2c2f;
            color: #e3e3e3;
            border: 1px solid #3c3d40;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .history-title {
            font-size: 0.8rem;
            color: #8e918f;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background-color: #333538;
            border-radius: 4px;
        }

        .history-item-wrapper {
            display: flex;
            align-items: center;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .history-item-wrapper:hover {
            background-color: #333538;
        }

        .history-item-wrapper.active {
            background-color: #2b2c2f;
        }

        .history-item {
            background: transparent;
            border: none;
            color: #c4c7c5;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .history-item-wrapper:hover .history-item,
        .history-item-wrapper.active .history-item {
            color: #ffffff;
        }

        .delete-chat-btn {
            background: transparent;
            border: none;
            color: #8e918f;
            cursor: pointer;
            padding: 8px 10px;
            font-size: 0.85rem;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .delete-chat-btn:hover {
            color: #f2b8b5;
        }

        .sidebar-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #2d2e30;
            gap: 8px;
        }

        .action-sidebar-btn {
            background: transparent;
            border: 1px solid #3c3d40;
            color: #8ab4f8;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            transition: background 0.2s;
        }

        .action-sidebar-btn:hover {
            background-color: #2b2c2f;
        }

        .trash-btn {
            background: transparent;
            border: none;
            color: #f2b8b5;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .trash-btn:hover {
            background-color: #3c2323;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: #2d2e30;
            border-radius: 4px;
        }

        .message {
            max-width: 90%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            cursor: pointer;
            transition: border-color 0.2s;
            border: 1px solid transparent;
        }

        .message.ai:hover {
            border-color: #3c3d40;
        }

        .message.user {
            background-color: #2b2c2f;
            color: #e3e3e3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            cursor: default;
        }

        .message.ai {
            background-color: transparent;
            color: #e3e3e3;
            align-self: flex-start;
            padding-left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message.error {
            background-color: #3c2323;
            color: #f2b8b5;
            align-self: center;
        }

        .ai-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .action-chip {
            background-color: #2b2c2f;
            border: 1px solid #3c3d40;
            color: #c4c7c5;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-chip:hover {
            background-color: #333538;
            color: #ffffff;
            border-color: #8ab4f8;
        }

        .analysis-box {
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius: 8px;
            background-color: #1e1f20;
            border: 1px solid #2d2e30;
            margin-top: 6px;
            display: none;
        }

        .result-card {
            background-color: #1a2634;
            border: 1px solid #314b6e;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }

        .result-card:hover {
            border-color: #8ab4f8;
        }

        .result-header {
            font-size: 0.8rem;
            color: #8ab4f8;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 2px;
            background-color: #8e918f;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .file-preview-box {
            width: 100%;
            max-width: 950px;
            padding: 0 20px;
            display: none;
            margin-bottom: 6px;
        }

        .file-tag {
            background-color: #2b2c2f;
            color: #8ab4f8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .remove-file-btn {
            background: transparent;
            border: none;
            color: #f2b8b5;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .input-area-wrapper {
            padding: 12px 40px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: linear-gradient(transparent, #131314 30%);
        }

        .input-box {
            background-color: #1e1f20;
            border-radius: 28px;
            width: 100%;
            max-width: 950px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: #8ab4f8;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e3e3e3;
            font-size: 0.95rem;
            resize: none;
            min-height: 24px;
            max-height: 150px;
            outline: none;
            line-height: 1.4;
        }

        .input-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #8e918f;
            padding-top: 4px;
        }

        .action-left, .action-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.2s, color 0.2s;
        }

        .tool-btn:hover {
            background-color: #333538;
            color: #ffffff;
        }

        .send-btn {
            background-color: #e3e3e3;
            color: #131314;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #ffffff;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #8e918f;
            padding-top: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="nuevoChat()">➕ Nuevo chat</button>
            
            <div class="model-selector-box">
                <span class="model-label">Modelo Activo:</span>
                <select id="modelSelect" class="model-select">
                    <option value="llama3.2">Llama 3.2 (Local)</option>
                    <option value="llama3">Llama 3</option>
                    <option value="mistral">Mistral</option>
                </select>
            </div>

            <div class="history-title">Conversaciones</div>
            <div class="history-list" id="historyList"></div>
        </div>
        <div class="sidebar-bottom">
            <button class="action-sidebar-btn" onclick="exportarChatActual()" title="Guardar chat activo">📥 Exportar</button>
            <button class="trash-btn" title="Eliminar todo el historial" onclick="borrarHistorialDefinitivo()">🗑️</button>
        </div>
    </aside>

    <main class="main-container">
        <div class="chat-container" id="chatContainer">
            <div class="message ai" onclick="mostrarConteoTexto(this.querySelector('.ai-text').textContent)">
                <div class="ai-text">¿En qué puedo ayudarte?</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; width: 100%; align-items: center;">
            <div id="filePreviewContainer" class="file-preview-box">
                <div class="file-tag">
                    <span id="fileBadge"></span>
                    <button class="remove-file-btn" onclick="quitarArchivo()" title="Quitar archivo">✕</button>
                </div>
            </div>
            
            <div class="input-area-wrapper">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Escribe un mensaje o adjunta un archivo..." rows="1" oninput="actualizarContadorEscritura(this); ajustarAlturaTextarea(this);" onkeydown="handleKeyPress(event)"></textarea>
                    
                    <div class="input-footer-info">
                        <div class="action-left">
                            <button class="tool-btn" title="Adjuntar archivo" onclick="document.getElementById('fileInput').click()">+</button>
                            <input type="file" id="fileInput" style="display: none;" onchange="manejarArchivo(this)">
                        </div>
                        <span id="wordCounter">0 palabras | 0 caracteres</span>
                        <div class="action-right">
                            <button class="send-btn" title="Enviar" onclick="enviarMensaje()">↑</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-note">💡 Tip: Haz clic en cualquier respuesta de la IA para ver sus palabras y caracteres en el contador.</div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const fileInput = document.getElementById('fileInput');
        const filePreviewContainer = document.getElementById('filePreviewContainer');
        const fileBadge = document.getElementById('fileBadge');
        const historyList = document.getElementById('historyList');
        const wordCounter = document.getElementById('wordCounter');
        const modelSelect = document.getElementById('modelSelect');

        let listaChats = JSON.parse(localStorage.getItem('omely_chats')) || [];
        let chatActivoId = null;
        let archivoCargadoBase64 = null;
        let archivoCargadoNombre = null;

        function ajustarAlturaTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function actualizarContadorEscritura(el) {
            const texto = el.value;
            actualizarContadorTexto(texto);
        }

        function actualizarContadorTexto(texto) {
            const caracteres = texto.length;
            const palabras = texto.trim() === '' ? 0 : texto.trim().split(/\s+/).length;
            wordCounter.textContent = `${palabras} palabras | ${caracteres} caracteres`;
        }

        function mostrarConteoTexto(texto) {
            actualizarContadorTexto(texto);
        }

        function guardarEnLocalStorage() {
            localStorage.setItem('omely_chats', JSON.stringify(listaChats));
        }

        function exportarChatActual() {
            const chatActual = listaChats.find(c => c.id === chatActivoId);
            if (!chatActual || chatActual.mensajes.length === 0) {
                alert("No hay un chat activo para exportar.");
                return;
            }
            let contenidoExportar = `--- CONVERSACIÓN: ${chatActual.titulo} ---\n\n`;
            chatActual.mensajes.forEach(m => {
                const rol = m.tipo === 'user' ? 'Usuario' : 'Omely';
                contenidoExportar += `${rol}: ${m.texto}\n\n`;
            });
            const blob = new Blob([contenidoExportar], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${chatActual.titulo.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_omely.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderizarHistorialSidebar() {
            historyList.innerHTML = '';
            listaChats.forEach(chat => {
                const wrapper = document.createElement('div');
                wrapper.className = `history-item-wrapper ${chat.id === chatActivoId ? 'active' : ''}`;

                const btnChat = document.createElement('button');
                btnChat.className = 'history-item';
                btnChat.textContent = chat.titulo;
                btnChat.onclick = () => cargarChat(chat.id);

                const btnEliminar = document.createElement('button');
                btnEliminar.className = 'delete-chat-btn';
                btnEliminar.innerHTML = '✕';
                btnEliminar.onclick = (e) => {
                    e.stopPropagation();
                    eliminarChatEspecifico(chat.id);
                };

                wrapper.appendChild(btnChat);
                wrapper.appendChild(btnEliminar);
                historyList.appendChild(wrapper);
            });
        }

        function nuevoChat() {
            chatActivoId = null;
            chatContainer.innerHTML = '<div class="message ai" onclick="mostrarConteoTexto(this.querySelector(\'.ai-text\').textContent)"><div class="ai-text">¿En qué puedo ayudarte?</div></div>';
            quitarArchivo();
            wordCounter.textContent = '0 palabras | 0 caracteres';
            renderizarHistorialSidebar();
        }

        function cargarChat(id) {
            chatActivoId = id;
            const chatEncontrado = listaChats.find(c => c.id === id);
            if (!chatEncontrado) return;

            chatContainer.innerHTML = '';
            chatEncontrado.mensajes.forEach(msg => {
                agregarMensajeDOM(msg.texto, msg.tipo);
            });
            renderizarHistorialSidebar();
        }

        function eliminarChatEspecifico(id) {
            listaChats = listaChats.filter(c => c.id !== id);
            guardarEnLocalStorage();
            if (chatActivoId === id) nuevoChat();
            else renderizarHistorialSidebar();
        }

        async function borrarHistorialDefinitivo() {
            if (confirm("¿Deseas eliminar todo el historial?")) {
                listaChats = [];
                guardarEnLocalStorage();
                nuevoChat();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                enviarMensaje();
            }
        }

        function manejarArchivo(input) {
            if (input.files && input.files[0]) {
                const archivo = input.files[0];
                archivoCargadoNombre = archivo.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    archivoCargadoBase64 = e.target.result;
                    fileBadge.textContent = `📎 ${archivoCargadoNombre}`;
                    filePreviewContainer.style.display = 'block';
                };
                reader.readAsDataURL(archivo);
            }
        }

        function quitarArchivo() {
            archivoCargadoBase64 = null;
            archivoCargadoNombre = null;
            fileInput.value = '';
            filePreviewContainer.style.display = 'none';
        }

        async function enviarMensaje() {
            const mensajeTexto = userInput.value.trim();
            if (!mensajeTexto && !archivoCargadoBase64) return;

            let textoVisual = mensajeTexto;
            if (archivoCargadoNombre && !mensajeTexto) {
                textoVisual = `Analizar archivo: ${archivoCargadoNombre}`;
            }

            let chatActual = listaChats.find(c => c.id === chatActivoId);
            if (!chatActual) {
                chatActual = {
                    id: 'chat_' + Date.now(),
                    titulo: textoVisual.substring(0, 32) + (textoVisual.length > 32 ? '...' : ''),
                    mensajes: []
                };
                listaChats.unshift(chatActual);
                chatActivoId = chatActual.id;
            }

            chatActual.mensajes.push({ texto: textoVisual, tipo: 'user' });
            agregarMensajeDOM(textoVisual, 'user');

            const historialSecuencia = chatActual.mensajes.map(m => ({
                pregunta: m.tipo === 'user' ? m.texto : '',
                respuesta: m.tipo === 'ai' ? m.texto : ''
            }));

            const payload = {
                mensaje: mensajeTexto,
                archivoContenido: archivoCargadoBase64,
                archivoNombre: archivoCargadoNombre,
                historialChat: historialSecuencia,
                modelo: modelSelect.value
            };

            userInput.value = '';
            userInput.style.height = '24px';
            wordCounter.textContent = '0 palabras | 0 caracteres';
            quitarArchivo();

            const { divMsg, textDiv } = agregarMensajeDOMConContenedor('', 'ai');
            textDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Error en el servidor');

                textDiv.textContent = data.respuesta || "Sin respuesta.";
                mostrarConteoTexto(data.respuesta || "");
                agregarAccionesIA(divMsg, textDiv);

                chatActual.mensajes.push({ texto: data.respuesta, tipo: 'ai' });
                guardarEnLocalStorage();
                renderizarHistorialSidebar();

            } catch (error) {
                divMsg.className = 'message error';
                textDiv.textContent = error.message;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function agregarMensajeDOM(texto, tipo) {
            const div = document.createElement('div');
            div.className = `message ${tipo}`;
            
            if (tipo === 'ai') {
                const textDiv = document.createElement('div');
                textDiv.className = 'ai-text';
                textDiv.textContent = texto;
                div.appendChild(textDiv);
                div.onclick = () => mostrarConteoTexto(texto);
                agregarAccionesIA(div, textDiv);
            } else {
                div.textContent = texto;
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function agregarMensajeDOMConContenedor(texto, tipo) {
            const div = document.createElement('div');
            div.className = `message ${tipo}`;
            const textDiv = document.createElement('div');
            textDiv.className = 'ai-text';
            textDiv.textContent = texto;
            div.appendChild(textDiv);
            div.onclick = () => mostrarConteoTexto(textDiv.textContent);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return { divMsg: div, textDiv };
        }

        function agregarAccionesIA(divMsg, textDiv) {
            const actionsBar = document.createElement('div');
            actionsBar.className = 'ai-actions';

            const btnDetectar = document.createElement('button');
            btnDetectar.className = 'action-chip';
            btnDetectar.textContent = '🔍 Analizar IA';
            
            const btnParafrasear = document.createElement('button');
            btnParafrasear.className = 'action-chip';
            btnParafrasear.textContent = '🔄 Parafrasear';

            const btnHumanizar = document.createElement('button');
            btnHumanizar.className = 'action-chip';
            btnHumanizar.textContent = '✨ Humanizar tono';

            const analysisBox = document.createElement('div');
            analysisBox.className = 'analysis-box';

            btnDetectar.onclick = (e) => {
                e.stopPropagation();
                analizarTextoIA(textDiv, btnDetectar, analysisBox);
            };

            btnParafrasear.onclick = (e) => {
                e.stopPropagation();
                ejecutarTransformacion(textDiv, 'parafrasear', btnParafrasear, divMsg);
            };

            btnHumanizar.onclick = (e) => {
                e.stopPropagation();
                ejecutarTransformacion(textDiv, 'humanizar', btnHumanizar, divMsg);
            };

            actionsBar.appendChild(btnDetectar);
            actionsBar.appendChild(btnParafrasear);
            actionsBar.appendChild(btnHumanizar);
            
            divMsg.appendChild(actionsBar);
            divMsg.appendChild(analysisBox);
        }

        async function analizarTextoIA(textDiv, btnDetectar, analysisBox) {
            btnDetectar.textContent = '🔍 Analizando...';
            analysisBox.style.display = 'block';
            analysisBox.textContent = 'Analizando texto...';
            try {
                const res = await fetch('/api/analizar-ia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: textDiv.textContent })
                });
                const data = await res.json();
                analysisBox.innerHTML = `📊 <b>Probabilidad de IA:</b> ${data.porcentaje}% ${data.cliches.length > 0 ? '<br>⚠️ <i>Patrones: ' + data.cliches.join(', ') + '</i>' : '<br>✅ Texto natural.'}`;
            } catch (e) {
                analysisBox.textContent = 'Error al realizar el análisis.';
            } finally {
                btnDetectar.textContent = '🔍 Analizar IA';
            }
        }

        async function ejecutarTransformacion(textDiv, tipo, btnObj, divMsg) {
            const nombreOriginalBtn = btnObj.textContent;
            btnObj.textContent = tipo === 'parafrasear' ? '🔄 Parafraseando...' : '✨ Humanizando...';
            try {
                const res = await fetch('/api/humanizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: textDiv.textContent, tipo: tipo, modelo: modelSelect.value })
                });
                const data = await res.json();
                crearTarjetaResultado(divMsg, tipo === 'parafrasear' ? '🔄 Versión Parafraseada:' : '✨ Versión Humanizada:', data.resultado);
            } catch (e) {
                alert('Error al procesar la transformación.');
            } finally {
                btnObj.textContent = nombreOriginalBtn;
            }
        }

        function crearTarjetaResultado(divMsg, titulo, contenido) {
            const resultCard = document.createElement('div');
            resultCard.className = 'result-card';
            resultCard.onclick = () => mostrarConteoTexto(contenido);

            const headerCard = document.createElement('div');
            headerCard.className = 'result-header';
            headerCard.innerHTML = `<span>${titulo}</span>`;

            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-chip';
            copyBtn.textContent = 'Copiar';
            copyBtn.onclick = (e) => {
                e.stopPropagation();
                navigator.clipboard.writeText(contenido);
                copyBtn.textContent = '¡Copiado!';
                setTimeout(() => copyBtn.textContent = 'Copiar', 2000);
            };

            headerCard.appendChild(copyBtn);
            const contentCard = document.createElement('div');
            contentCard.textContent = contenido;

            resultCard.appendChild(headerCard);
            resultCard.appendChild(contentCard);
            agregarAccionesIA(resultCard, contentCard);
            divMsg.appendChild(resultCard);
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            mostrarConteoTexto(contenido);
        }

        renderizarHistorialSidebar();
    </script>
</body>
</html>
