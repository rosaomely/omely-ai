<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omely AI - Professional Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
  <style>
    .prose pre { background-color: #1e222b; border: 1px solid #323846; border-radius: 0.75rem; padding: 1rem; margin: 0.75rem 0; overflow-x: auto; }
    .prose code { color: #f472b6; font-family: monospace; }
  </style>
</head>
<body class="bg-[#13161f] text-[#d1d5db] flex h-screen overflow-hidden font-sans">

  <!-- Panel Lateral Rosado -->
  <aside class="w-72 bg-[#171b26] border-r border-[#212633] flex flex-col shrink-0">
    <div class="p-4 flex items-center justify-between">
      <span class="text-xs font-semibold text-pink-300">Omely AI Panel</span>
      <button onclick="nuevoChat()" class="text-xs text-pink-300 hover:text-white bg-[#222838] px-2.5 py-1 rounded-lg border border-[#31394e]">Nuevo Chat</button>
    </div>
    <div id="lista-conversaciones" class="flex-1 overflow-y-auto px-3 py-2 space-y-2 text-xs"></div>
  </aside>

  <!-- Contenedor Principal -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="border-b border-[#212633] bg-[#171b26] px-6 py-4 flex items-center justify-between">
      <h1 class="text-sm font-bold text-[#f3f4f6]">Omely AI <span class="text-xs text-pink-300 font-mono">Modo Seguro y Libre</span></h1>
    </header>

    <!-- Zona de Mensajes -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto"></div>

    <!-- Barra de Escritura -->
    <footer class="p-4 border-t border-[#212633] bg-[#171b26]">
      <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
        <input type="text" id="user-input" placeholder="Escribe tu consulta para Omely..." autocomplete="off"
          class="flex-1 bg-[#13161f] border border-[#2b3242] focus:border-pink-500 rounded-xl px-4 py-3 text-sm focus:outline-none text-[#f3f4f6]">
        <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-5 py-3 rounded-xl text-sm transition">
          Enviar <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </footer>
  </main>

  <script>
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if (!texto) return;

      // Mostrar mensaje del usuario
      appendMessage('user', texto);
      input.value = '';

      // Mostrar estado de carga
      const loadingId = appendMessage('assistant', 'Pensando respuesta...');

      try {
        // Llamada a nuestra propia API interna segura de Netlify
        const respuesta = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: texto })
        });

        const data = await respuesta.json();
        const contenidoIA = data.choices?.[0]?.message?.content || "Lo siento, hubo un problema al procesar la respuesta.";
        
        updateMessage(loadingId, contenidoIA);
      } catch (err) {
        updateMessage(loadingId, "Error de conexión con el servidor seguro.");
      }
    });

    function appendMessage(role, text) {
      const id = 'msg_' + Date.now() + Math.random();
      const div = document.createElement('div');
      div.id = id;
      div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
      
      const bubble = document.createElement('div');
      bubble.className = `max-w-xl rounded-2xl px-4 py-3 text-sm ${role === 'user' ? 'bg-pink-600 text-white' : 'bg-[#222838] text-gray-200 border border-[#31394e] prose'}`;
      
      if (role === 'assistant') {
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        bubble.textContent = text;
      }
      
      div.appendChild(bubble);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function updateMessage(id, text) {
      const el = document.getElementById(id);
      if (el) {
        const bubble = el.querySelector('div');
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
    
    function nuevoChat() {
      chatBox.innerHTML = '';
    }
  </script>
</body>
</html>
