<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omely AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
            width: 100vw;
        }

        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid #2d2e30;
            justify-content: space-between;
            transition: width 0.3s;
            flex-shrink: 0;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            flex: 1;
        }

        .new-chat-btn {
            background-color: #2b2c2f;
            color: #e3e3e3;
            border: none;
            padding: 10px 16px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            background-color: #333538;
        }

        .history-title {
            font-size: 0.8rem;
            color: #8e918f;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
        }

        .history-item {
            background: transparent;
            border: none;
            color: #c4c7c5;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: #333538;
            color: #ffffff;
        }

        .sidebar-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #2d2e30;
        }

        .trash-btn {
            background: transparent;
            border: none;
            color: #f2b8b5;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .trash-btn:hover {
            background-color: #3c2323;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .message {
            max-width: 90%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: #2b2c2f;
            color: #e3e3e3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background-color: transparent;
            color: #e3e3e3;
            align-self: flex-start;
            padding-left: 0;
            width: 100%;
        }

        .message.error {
            background-color: #3c2323;
            color: #f2b8b5;
            align-self: center;
        }

        .chat-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
            border: 1px solid #444;
        }

        .file-tag {
            background-color: #2b2c2f;
            color: #8ab4f8;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 6px;
        }

        .input-area-wrapper {
            padding: 12px 40px 20px 40px;
            display: flex;
            justify-content: center;
            width: 100%;
            background: linear-gradient(transparent, #131314 30%);
        }

        .input-box {
            background-color: #1e1f20;
            border-radius: 28px;
            width: 100%;
            max-width: 950px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: #8ab4f8;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e3e3e3;
            font-size: 0.95rem;
            resize: none;
            height: 24px;
            max-height: 120px;
            outline: none;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-left, .action-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background-color: #333538;
            color: #ffffff;
        }

        .send-btn {
            background-color: #e3e3e3;
            color: #131314;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #ffffff;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #8e918f;
            padding-bottom: 6px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Panel lateral izquierdo con historial visible -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="nuevoChat()">➕ Nuevo chat</button>
            <div class="history-title">Conversaciones (90 días)</div>
            <div class="history-list" id="historyList">
                <!-- Se llenará automáticamente con JS -->
            </div>
        </div>
        <div class="sidebar-bottom">
            <span style="font-size: 0.75rem; color: #8e918f;">Historial local</span>
            <button class="trash-btn" title="Eliminar historial definitivamente" onclick="borrarHistorialDefinitivo()">🗑️</button>
        </div>
    </aside>

    <main class="main-container">
        <div class="chat-container" id="chatContainer">
            <div class="message ai">¿En qué puedo ayudarte?</div>
        </div>

        <div style="display: flex; flex-direction: column; width: 100%; align-items: center;">
            <div id="filePreviewContainer" style="width: 100%; max-width: 950px; padding: 0 20px; display: none;">
                <span id="fileBadge" class="file-tag"></span>
            </div>
            <div class="input-area-wrapper">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Escribe un mensaje o adjunta un archivo..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-actions">
                        <div class="action-left">
                            <button class="tool-btn" title="Adjuntar archivo" onclick="document.getElementById('fileInput').click()">+</button>
                            <input type="file" id="fileInput" style="display: none;" onchange="manejarArchivo(this)">
                        </div>
                        <div class="action-right">
                            <button class="send-btn" title="Enviar" onclick="enviarMensaje()">↑</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-note">Omely AI es un modelo local y puede cometer errores.</div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const fileInput = document.getElementById('fileInput');
        const filePreviewContainer = document.getElementById('filePreviewContainer');
        const fileBadge = document.getElementById('fileBadge');
        const historyList = document.getElementById('historyList');

        let archivoCargadoBase64 = null;
        let archivoCargadoNombre = null;

        // Cargar historial al iniciar la página
        async function cargarHistorial() {
            try {
                const response = await fetch('/api/historial');
                const chats = await response.json();
                historyList.innerHTML = '';
                
                chats.forEach(chat => {
                    const btn = document.createElement('button');
                    btn.className = 'history-item';
                    btn.textContent = chat.pregunta.substring(0, 35) + '...';
                    btn.onclick = () => {
                        chatContainer.innerHTML = '';
                        agregarMensaje(chat.pregunta, 'user');
                        agregarMensaje(chat.respuesta, 'ai');
                    };
                    historyList.appendChild(btn);
                });
            } catch (error) {
                console.error("No se pudo cargar el historial.");
            }
        }

        cargarHistorial();

        function nuevoChat() {
            chatContainer.innerHTML = '<div class="message ai">¿En qué puedo ayudarte?</div>';
            quitarArchivo();
        }

        async function borrarHistorialDefinitivo() {
            if (confirm("¿Deseas eliminar el historial definitivamente? Se borrarán todos los registros acumulados.")) {
                try {
                    const response = await fetch('/api/historial', { method: 'DELETE' });
                    const data = await response.json();
                    alert(data.mensaje);
                    cargarHistorial();
                    nuevoChat();
                } catch (error) {
                    alert("Error al eliminar el historial.");
                }
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                enviarMensaje();
            }
        }

        function manejarArchivo(input) {
            if (input.files && input.files[0]) {
                const archivo = input.files[0];
                archivoCargadoNombre = archivo.name;

                const reader = new FileReader();
                reader.onload = function(e) {
                    archivoCargadoBase64 = e.target.result;
                    fileBadge.textContent = `📎 Archivo listo: ${archivoCargadoNombre}`;
                    filePreviewContainer.style.display = 'block';
                };
                reader.readAsDataURL(archivo);
            }
        }

        function quitarArchivo() {
            archivoCargadoBase64 = null;
            archivoCargadoNombre = null;
            fileInput.value = '';
            filePreviewContainer.style.display = 'none';
        }

        async function enviarMensaje() {
            const mensajeTexto = userInput.value.trim();
            if (!mensajeTexto && !archivoCargadoBase64) return;

            let textoVisual = mensajeTexto;
            if (archivoCargadoNombre && !mensajeTexto) {
                textoVisual = `Analizar archivo: ${archivoCargadoNombre}`;
            }

            agregarMensaje(textoVisual, 'user');

            const payload = {
                mensaje: mensajeTexto,
                archivoContenido: archivoCargadoBase64,
                archivoNombre: archivoCargadoNombre
            };

            userInput.value = '';
            quitarArchivo();

            const aiMessageDiv = agregarMensaje('...', 'ai');

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error en la respuesta del servidor');
                }

                aiMessageDiv.textContent = data.respuesta || "Sin respuesta.";
                cargarHistorial(); // Actualiza la lista lateral automáticamente

            } catch (error) {
                aiMessageDiv.className = 'message error';
                aiMessageDiv.textContent = error.message;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function agregarMensaje(texto, tipo) {
            const div = document.createElement('div');
            div.className = `message ${tipo}`;
            div.textContent = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
